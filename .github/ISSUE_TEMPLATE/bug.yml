name: Beta bug report
description: Report a reproducible visual or functional problem in Archive Olive.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Archive Olive. Search existing issues first, use a clean vault when practical, and remove personal information from screenshots.

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Include both the current version and installer version from Obsidian's About screen.
      placeholder: 'Current 1.12.7; installer 1.12.7'
    validations:
      required: true

  - type: input
    id: theme-version
    attributes:
      label: Archive Olive version or commit
      description: Use the manifest version and, if possible, the Git commit shown by BRAT or GitHub.
      placeholder: '0.1.0; commit abc1234'
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and device
      placeholder: 'Windows 11 24H2; desktop PC'
    validations:
      required: true

  - type: input
    id: brat-version
    attributes:
      label: BRAT version
      placeholder: '1.x.x'
    validations:
      required: true

  - type: dropdown
    id: appearance
    attributes:
      label: Appearance
      options:
        - Light
        - Dark
        - Both
        - System-dependent
    validations:
      required: true

  - type: textarea
    id: extensions
    attributes:
      label: CSS snippets and relevant plugins
      description: List enabled snippets and plugins that affect the broken surface. Write "None" if disabled.
      placeholder: |
        CSS snippets: None
        Relevant plugins: None
    validations:
      required: true

  - type: dropdown
    id: clean-vault
    attributes:
      label: Does it reproduce in a clean vault?
      options:
        - 'Yes'
        - 'No'
        - Not tested
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or recordings
      description: Drag files here after removing vault names, note content, account data, and notifications.

  - type: textarea
    id: console
    attributes:
      label: Developer-console errors
      description: Paste only errors that appear related to the theme. Remove paths or personal data.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal vault content, account data, and credentials from this report.
          required: true

# Source Manifest:
# - docs/specs/brat-beta-release.md
# - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
